  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Custom Setup — QuickBillFree Business (£350)</title>
  <meta name="description" content="Request a custom white-label QuickBillFree Business invoicing portal for your company (£350 setup, optional £29/month hosting).">
  <link rel="canonical" href="https://quickbillfree.com/business-contact.html">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <meta name="theme-color" content="#4f46e5">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="blog.css">
</head>
<body class="blog-page">
  <nav class="blog-nav">
    <div class="container blog-nav-container">
      <a href="business.html" class="blog-brand">
        <img src="assets/favicon.svg" alt="QuickBillFree" width="30" height="30">
        <span>Quick<span style="color: var(--blog-primary);">Bill</span><span style="color: #10b981; font-weight: 800; font-size: 0.95em;">Free</span></span>
        <span class="blog-badge-tag">Inquiry</span>
      </a>
      <div class="blog-nav-links">
        <a href="business.html" class="btn-nav-ghost">← Overview</a>
        <a href="business-demo.html" class="btn-nav-ghost">Live Demo</a>
      </div>
    </div>
  </nav>

  <header class="blog-hero">
    <div class="container">
      <h1 class="blog-hero-title">Request Your Custom Invoicing Setup</h1>
      <p class="blog-hero-subtitle">Fill out your business details below to open a pre-filled email to support@quickbillfree.com — zero obligation.</p>
    </div>
  </header>

  <main class="container" style="max-width: 680px; margin: 0 auto 60px; padding: 0 20px;">
    <section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);">
      <form id="inquiryForm" style="display: grid; gap: 14px;">
        <div>
          <label for="inqBiz" style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:5px;">Business Name *</label>
          <input id="inqBiz" required placeholder="e.g. Apex Plumbing Ltd" style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">
        </div>
        <div>
          <label for="inqName" style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:5px;">Your Name &amp; Contact Email *</label>
          <input id="inqName" required placeholder="e.g. Alex Smith (alex@apexplumbing.co.uk)" style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">
        </div>
        <div>
          <label for="inqPlan" style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:5px;">Package</label>
          <select id="inqPlan" style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">
            <option value="£350 Setup + £29/month Managed Hosting">£350 Setup + £29/month Managed Hosting</option>
            <option value="£350 Setup Only (Self-Hosted Docker)">£350 Setup Only (Self-Hosted Docker)</option>
          </select>
        </div>
        <div>
          <label for="inqNotes" style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:5px;">Domain / Branding / Requirements</label>
          <textarea id="inqNotes" rows="4" placeholder="Preferred domain (e.g. billing.apexplumbing.co.uk), currency, VAT requirements..." style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; box-sizing:border-box;"></textarea>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button type="submit" class="btn-nav-primary" style="flex:1; padding: 12px; border:none; cursor:pointer; font-size:0.95rem;">✉️ Open Pre-Filled Email</button>
          <button type="button" id="btnCopyInq" class="btn-nav-ghost" style="padding: 12px; border: 1px solid #cbd5e1; cursor:pointer;">📋 Copy Inquiry Text</button>
        </div>
        <p id="inqStatus" style="font-size: 0.85rem; color: #059669; font-weight: 600; margin: 0;"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 QuickBillFree.com — <a href="business.html">Business Overview</a> • <a href="business-demo.html">Live Demo</a></p>
    </div>
  </footer>

  <script>
    (function () {
      function buildBody() {
        const biz = document.getElementById('inqBiz').value.trim();
        const contact = document.getElementById('inqName').value.trim();
        const plan = document.getElementById('inqPlan').value;
        const notes = document.getElementById('inqNotes').value.trim();
        return `Business Name: ${biz}\nContact: ${contact}\nPackage: ${plan}\n\nRequirements:\n${notes || 'Standard white-label setup'}`;
      }

      document.getElementById('inquiryForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const biz = document.getElementById('inqBiz').value.trim();
        const subject = `QuickBillFree Business Setup Inquiry — ${biz}`;
        const body = buildBody();
        window.location.href = `mailto:support@quickbillfree.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        document.getElementById('inqStatus').textContent = 'Opening your email app addressed to support@quickbillfree.com...';
      });

      document.getElementById('btnCopyInq').addEventListener('click', () => {
        navigator.clipboard?.writeText(buildBody()).then(() => {
          document.getElementById('inqStatus').textContent = 'Inquiry copied — email it to support@quickbillfree.com!';
        });
      });
    })();
  </script>
</body>
</html>
